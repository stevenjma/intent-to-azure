name: Production health

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Pages and OAuth Worker
        env:
          PAGE_URL: https://stevenjma.github.io/intent-to-azure/
          WORKER_URL: ${{ vars.GH_WORKER_URL }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [ -n "$WORKER_URL" ] || { echo "::error::GH_WORKER_URL is unset"; exit 1; }
          page_html="$(curl --fail --silent --show-error --location --max-time 20 "$PAGE_URL")"
          grep -q "App Intent" <<<"$page_html"
          release_json="$(curl --fail --silent --show-error --location --max-time 20 \
            "${PAGE_URL%/}/release.json")"
          jq -e --arg sha "$RELEASE_SHA" '.sha == $sha' <<<"$release_json" >/dev/null
          worker_health="$(curl --fail --silent --show-error --location --max-time 20 \
            "${WORKER_URL%/}/health")"
          jq -e '.status == "ok"' <<<"$worker_health" >/dev/null
          jq -e '.deployment | type == "string" and length > 0 and . != "unknown"' \
            <<<"$worker_health" >/dev/null
