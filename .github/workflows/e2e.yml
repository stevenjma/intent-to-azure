# azx end-to-end harness.
#
# Throws real, committed Next.js app trees (test/e2e/apps/*) at azx and proves each
# stage with a DISTINCT gate:
#
#   analyzed    azx plan --json runs
#   plan-match  intent.needs + plan.resources + region == test/e2e/expectations.json
#   compile     `az bicep build` on the emitted template          (real compiler, NO Azure login/network)
#   what-if     `az deployment group what-if` in a validation RG    (only if BYO-Azure repo vars are set)
#
# Codegen status: the two azx codegen bugs this harness originally pinned as
# expected FAILs — the CognitiveServices customSubDomainName BCP057 error and the
# empty Container Apps / Jobs containers[] — are now FIXED (see src/bicep.ts and
# test/e2e/README.md). expectations.json therefore expects compile=PASS for every
# fixture, and the compile gate is the offline proof of those fixes.
#
# All four fixtures currently compile and pass the OPTIONAL real-Azure what-if
# gate. expectations.json records that validated baseline and fails if it drifts.
#
# By default this workflow makes ZERO real-Azure calls: only `az bicep build`
# (a local compiler, no login/network) runs. The real-Azure what-if gate is
# opt-in — it stays SKIPPED unless BYO-Azure OIDC repo *variables* are set.
# These use a separate E2E_AZURE_* identity so CI can never
# overwrite the public browser application's AZURE_CLIENT_ID. The shipped POC #1
# what-if is the fully offline
# `azx what-if` CLI command, which never contacts Azure.
#
# BYO-Azure (optional, enables the what-if gate on trusted main runs): run
# scripts/setup-azure-oidc.sh (or .ps1) once to create a main-only federated
# identity scoped to persistent validation resource groups and set the repo *variables*
# E2E_AZURE_CLIENT_ID / E2E_AZURE_TENANT_ID / E2E_AZURE_SUBSCRIPTION_ID.
# No client secret is stored.

name: e2e

on:
  workflow_dispatch: {}
  # These four matrix jobs are required branch checks, so every PR must create them.
  pull_request: {}
  push:
    branches: [main]
    paths:
      - "test/e2e/**"
      - ".github/workflows/e2e.yml"
      - "src/**"
      - "package.json"
      - "package-lock.json"

permissions:
  id-token: write   # OIDC for azure/login (what-if gate)
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - next-minimal
          - next-prisma-postgres
          - next-openai
          - next-blob-storage
    env:
      APP: ${{ matrix.app }}
      REGION: eastus2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Build azx (pinned, public npm registry)
        run: |
          # The committed root package-lock.json is regenerated off the public
          # registry (registry.npmjs.org — enforced by scripts/verify-lockfile.sh +
          # .github/workflows/lockfile-guard.yml, and pinned by .npmrc), so a
          # hermetic, pinned `npm ci` works from public runners with clean egress.
          # Nothing is mutated or committed.
          npm ci
          npm run build

      - name: azx plan
        run: node dist/src/cli.js plan "test/e2e/apps/$APP" --json > "plan-$APP.json"

      - name: azx bicep
        run: node dist/src/cli.js bicep "test/e2e/apps/$APP" --out "main-$APP.bicep"

      - name: Compile gate (az bicep build)
        id: compile
        run: |
          az bicep install >/dev/null 2>&1 || true
          if az bicep build --file "main-$APP.bicep" --stdout > "arm-$APP.json" 2> "bicep-$APP.err"; then
            echo "compile=pass" >> "$GITHUB_OUTPUT"
            echo "::notice title=compile $APP::PASS"
          else
            echo "compile=fail" >> "$GITHUB_OUTPUT"
            echo "::warning title=compile $APP::FAIL"; sed -n '1,5p' "bicep-$APP.err" || true
          fi

      - name: Azure login (OIDC, optional)
        id: login
        if: >-
          ${{ github.ref == 'refs/heads/main' &&
              vars.E2E_AZURE_CLIENT_ID != '' &&
              vars.E2E_AZURE_TENANT_ID != '' &&
              vars.E2E_AZURE_SUBSCRIPTION_ID != '' &&
              steps.compile.outputs.compile == 'pass' }}
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.E2E_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.E2E_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.E2E_AZURE_SUBSCRIPTION_ID }}

      - name: What-if gate (validation RG)
        id: whatif
        if: ${{ steps.login.outcome == 'success' }}
        run: |
          RG="azx-e2e-$APP"
          echo "rg=$RG" >> "$GITHUB_OUTPUT"
          PARAM_ARGS=()
          if grep -q "param postgresAdminPassword" "main-$APP.bicep"; then
            PASSWORD="$(openssl rand -base64 32)"
            printf '{"postgresAdminPassword":{"value":"%s"}}\n' "$PASSWORD" > "params-$APP.json"
            unset PASSWORD
            PARAM_ARGS=(--parameters "@params-$APP.json")
          fi
          if az deployment group what-if -g "$RG" --template-file "main-$APP.bicep" \
            "${PARAM_ARGS[@]}" --no-pretty-print > "whatif-$APP.txt" 2>&1; then
            echo "whatif=pass" >> "$GITHUB_OUTPUT"
            echo "::notice title=what-if $APP::PASS"
          else
            echo "whatif=fail" >> "$GITHUB_OUTPUT"
            echo "::warning title=what-if $APP::FAIL"; sed -n '1,8p' "whatif-$APP.txt" || true
          fi

      - name: Reconcile gates (assert)
        run: |
          node test/e2e/assert.mjs \
            --app "$APP" \
            --plan "plan-$APP.json" \
            --compile "${{ steps.compile.outputs.compile }}" \
            --whatif "${{ steps.whatif.outputs.whatif || 'skip' }}"

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: azx-e2e-${{ matrix.app }}
          path: |
            plan-${{ matrix.app }}.json
            main-${{ matrix.app }}.bicep
            arm-${{ matrix.app }}.json
            bicep-${{ matrix.app }}.err
            whatif-${{ matrix.app }}.txt
          if-no-files-found: ignore
          retention-days: 7
