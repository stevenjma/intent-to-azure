name: Deploy SPA to GitHub Pages

# Builds the browser engine (tsc + scripts/build-web.mjs) and publishes web/ to Pages.
# Enable Pages for this repo (Settings → Pages → Source: GitHub Actions) first.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "scripts/build-web.mjs"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build browser engine assets
        run: npm run build:web

      - name: Generate web/config.js from repo Variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT: ${{ vars.AZURE_TENANT }}
          GH_OAUTH_CLIENT_ID: ${{ vars.GH_OAUTH_CLIENT_ID }}
          GH_WORKER_URL: ${{ vars.GH_WORKER_URL }}
        run: |
          # All four are PUBLIC identifiers (no secrets). Set them under
          # Settings → Secrets and variables → Actions → Variables.
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "AZURE_CLIENT_ID variable unset — publishing placeholder config (setup banner)."
            cp web/config.example.js web/config.js
          else
            cat > web/config.js <<EOF
          window.AZX_CONFIG = {
            azureClientId: "${AZURE_CLIENT_ID}",
            azureTenant: "${AZURE_TENANT:-common}",
            githubClientId: "${GH_OAUTH_CLIENT_ID}",
            githubWorkerUrl: "${GH_WORKER_URL}",
            githubScopes: "repo read:user",
          };
          EOF
            echo "Generated web/config.js from repo Variables."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
