name: Deploy SPA to GitHub Pages

# Builds the browser engine (tsc + scripts/build-web.mjs) and publishes web/ to Pages.
# Enable Pages for this repo (Settings → Pages → Source: GitHub Actions) first.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build browser engine assets
        run: npm run build:web

      - name: Generate web/config.js from repo Variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT: ${{ vars.AZURE_TENANT }}
          GH_OAUTH_CLIENT_ID: ${{ vars.GH_OAUTH_CLIENT_ID }}
          GH_WORKER_URL: ${{ vars.GH_WORKER_URL }}
          GH_SCOPES: ${{ vars.GH_SCOPES }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";

          const required = ["AZURE_CLIENT_ID", "GH_OAUTH_CLIENT_ID", "GH_WORKER_URL"];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length) {
            throw new Error(`Refusing production deploy: missing repository variable(s): ${missing.join(", ")}`);
          }

          const azureClientId = process.env.AZURE_CLIENT_ID.trim();
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(azureClientId)) {
            throw new Error("AZURE_CLIENT_ID must be a GUID.");
          }
          const worker = new URL(process.env.GH_WORKER_URL.trim());
          if (worker.protocol !== "https:") throw new Error("GH_WORKER_URL must use HTTPS.");

          const config = {
            azureClientId,
            azureTenant: process.env.AZURE_TENANT?.trim() || "common",
            githubClientId: process.env.GH_OAUTH_CLIENT_ID.trim(),
            githubWorkerUrl: worker.origin,
            githubScopes: process.env.GH_SCOPES?.trim() || "repo workflow read:user",
          };
          writeFileSync("web/config.js", `window.AZX_CONFIG = ${JSON.stringify(config, null, 2)};\n`);
          NODE

      - name: Write release identity
        run: printf '{"sha":"%s"}\n' "$GITHUB_SHA" > web/release.json

      # upload-pages-artifact currently invokes upload-artifact by a mutable tag,
      # which conflicts with this repository's full-SHA Actions policy. Build the
      # Pages artifact explicitly and upload it with the pinned action instead.
      - name: Package Pages artifact
        run: tar --dereference --hard-dereference --directory web -cvf "$RUNNER_TEMP/artifact.tar" .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5; do
            if body="$(curl --fail --silent --show-error --location --max-time 20 "$PAGE_URL")" &&
               grep -q "App Intent" <<<"$body" &&
               release="$(curl --fail --silent --show-error --location --max-time 20 "${PAGE_URL%/}/release.json")" &&
               grep -q "\"sha\":\"$RELEASE_SHA\"" <<<"$release"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Pages deployment did not pass its smoke test."
          exit 1
