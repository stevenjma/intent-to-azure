name: Deploy OAuth Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: oauth-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/worker
          command: deploy
      - name: Verify Worker
        env:
          WORKER_URL: ${{ vars.GH_WORKER_URL }}
        run: |
          [ -n "$WORKER_URL" ] || { echo "::error::GH_WORKER_URL is unset"; exit 1; }
          worker_health="$(curl --fail --silent --show-error --location --max-time 20 \
            "${WORKER_URL%/}/health")"
          jq -e '.status == "ok"' <<<"$worker_health" >/dev/null
          jq -e '.deployment | type == "string" and length > 0 and . != "unknown"' \
            <<<"$worker_health" >/dev/null
