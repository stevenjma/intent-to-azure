name: lockfile-guard

# Fails CI if any tracked package-lock.json or .npmrc references an internal
# Azure DevOps npm feed or contains committed auth material. Prevents the
# internal-feed leak fixed in PR #3 from silently returning.

on:
  pull_request:
  push:
    branches: [main, poc-1-dry-run-engine]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan lockfiles and .npmrc for internal feeds / auth tokens
        run: bash scripts/verify-lockfile.sh
